name: Winlator POCO X3

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Download Winlator Source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: winlator

      - name: Inspect Build Requirements
        shell: bash
        run: |
          cd winlator

          echo "===== SOURCE VERSION ====="
          git rev-parse HEAD

          echo "===== ROOT BUILD ====="
          cat build.gradle

          echo "===== APP BUILD ====="
          cat app/build.gradle

          echo "===== GRADLE WRAPPER ====="
          cat gradle/wrapper/gradle-wrapper.properties

          echo "===== ASSETS ====="
          du -sh app/src/main/assets 2>/dev/null || true

          echo "===== BUILD CONFIGURATION ====="
          grep -R -nE \
            'applicationId|compileSdk|minSdk|ndkVersion|externalNativeBuild' \
            app/build.gradle || true

          echo "===== AVAILABLE TASKS ====="
          chmod +x gradlew
          ./gradlew tasks --all --no-daemon
