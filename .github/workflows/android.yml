name: Winlator POCO X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Winlator Source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: winlator

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            winlator/**/*.gradle
            winlator/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Inspect Project
        run: |
          cd winlator
          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD
          echo "===== GRADLE VERSION ====="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "===== AVAILABLE ASSETS ====="
          du -sh app/src/main/assets 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd winlator
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-POCO-X3-v0.1
          path: winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
