name: Winlator POCO X3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Winlator Source
        uses: actions/checkout@v4
        with:
          repository: brunodev85/winlator-app
          ref: main
          path: winlator

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            winlator/**/*.gradle
            winlator/gradle/wrapper/gradle-wrapper.properties

      - name: Setup Android SDK
        run: |
          echo "===== ANDROID SDK ====="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "===== SDK MANAGER ====="
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(command -v sdkmanager || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          "$SDKMANAGER" --version

      - name: Inspect Project
        run: |
          cd winlator
          echo "===== SOURCE COMMIT ====="
          git rev-parse HEAD
          echo "===== GRADLE VERSION ====="
          cat gradle/wrapper/gradle-wrapper.properties
          echo "===== AVAILABLE ASSETS ====="
          du -sh app/src/main/assets 2>/dev/null || true

      - name: Inspect Launcher Source
        run: |
          echo "===== MAIN ACTIVITIES ====="
          find winlator/app/src/main -type f \
            \( -name '*Activity.java' -o -name '*Activity.kt' \) \
            | head -60

          echo "===== LAYOUT FILES ====="
          find winlator/app/src/main/res/layout -maxdepth 1 \
            -type f | head -60

          echo "===== APPLICATION ID ====="
          grep -R -n 'applicationId' \
            winlator/app/build.gradle* || true

      - name: Inspect L4D Integration
        run: |
          echo "===== MAIN ACTIVITY ====="
          sed -n '1,220p' winlator/app/src/main/java/com/winlator/MainActivity.java

          echo "===== MAIN LAYOUT ====="
          sed -n '1,180p' winlator/app/src/main/res/layout/main_activity.xml

          echo "===== CONTAINER LAUNCH ====="
          grep -R -n -E 'startActivity|ContainerDetailFragment|XServerDisplayActivity' \
            winlator/app/src/main/java/com/winlator/MainActivity.java \
            winlator/app/src/main/java/com/winlator/ui/ 2>/dev/null | head -70

          echo "===== APP NAME ====="
          grep -R -n 'app_name' \
            winlator/app/src/main/res/values/strings.xml | head -10

      - name: Build Debug APK
        run: |
          cd winlator
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-POCO-X3-v0.1
          path: winlator/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
